    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: watermark the timeline or ELSE
          command: |
            mkdir -p /tmp/batch5
            set +o pipefail 2>/dev/null; for i in $(seq 1 1000); do echo "pathlike: /stage/${i}/${i}.data"; done > /tmp/batch5/ux_dev; true
            echo "status=ok:bytes=$(wc -c </tmp/batch5/ux_dev):hash=$(md5sum /tmp/batch5/ux_dev | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/batch5
          paths:
            - 'ux_dev'
  fx-old:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
